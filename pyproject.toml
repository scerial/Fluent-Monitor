[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluentmon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psutil",
    "httpx",
    "zeroconf",
    "tomli-w",
    "orjson",
    "watchdog",
    "qrcode",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
fmon = "fluentmon.cli:main"

[tool.setuptools.packages.find]
include = ["fluentmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: needs a real Windows PC"]
